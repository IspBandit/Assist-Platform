      properties:
        id:
          type: string
        business_name:
          type: string
        slug:
          type: string
        status:
          type: string
        lifecycle:
          type: string
        town:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
    ProviderDetail:
      allOf:
        - $ref: '#/components/schemas/ProviderSummary'
