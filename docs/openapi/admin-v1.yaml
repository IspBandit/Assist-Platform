      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderSummary'
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    ProviderDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ProviderDetail'
    ProviderSummary:
      type: object
