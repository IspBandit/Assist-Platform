        items:
          type: array
          items:
            type: object
            required: [entity_type, id]
            properties:
              entity_type:
                type: string
                enum: [provider, stay]
              id:
                type: integer
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          type: object
          additionalProperties: true
