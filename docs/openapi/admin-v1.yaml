  /sync-conflicts:
    get:
      tags: [Sync]
      operationId: adminSyncConflictsIndex
      summary: List RIC live sync conflicts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sync conflict collection
  /feature-flags:
    get:
      tags: [FeatureFlags]
      operationId: adminFeatureFlagsIndex
      summary: List platform feature flags (read-only)
      description: |
        Assist RIC Operations catalogue (`flags:read`). Returns flag key,
        enabled state, description and updated_at. Brand scope is platform-wide.
        No Admin API write or toggle paths — changes remain website admin.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Feature-flag collection (writable=false)

components:

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    QueryQ:
      name: q
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      description: DB status or lifecycle alias (published, unpublished, pending_review, inactive)
      schema:
        type: string
    Town:
      name: town
      in: query
      schema:
        type: string
    State:
      name: state
      in: query
      description: State id, abbreviation, or name
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token from /auth/login, /auth/refresh or /auth/token. Only hashes are stored.
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, service, api_version]
          properties:
            status:
              type: string
              enum: [ok]
            service:
              type: string
            api_version:
              type: string
              enum: [v1]
    VersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [api_version, product]
          properties:
            api_version:
              type: string
            product:
              type: string
            release:
              type: string
              nullable: true
            php:
              type: string
    CapabilitiesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [api_version, enabled, resources]
          properties:
            api_version:
              type: string
            enabled:
              type: boolean
            restricted:
              type: boolean
            mfa_required:
              type: boolean
            mfa_enforced:
              type: boolean
            authentication:
              type: object
              additionalProperties:
                type: string
            resources:
              type: object
              additionalProperties:
                type: string
            limits:
              type: object
              additionalProperties: true
            scopes:
              type: object
              additionalProperties:
                type: object
                properties:
                  human:
                    type: boolean
                  service:
                    type: boolean
                  description:
                    type: string
            notes:
              type: array
              items:
                type: string
    TokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, refresh_token, token_type, expires_in, scopes, user]
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
            scopes:
              type: array
              items:
                type: string
            user:
