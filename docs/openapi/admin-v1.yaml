        name:
          type: string
        slug:
          type: string
        status:
          type: string
        lifecycle:
          type: string
        town:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
    StayDetail:
      allOf:
        - $ref: '#/components/schemas/StaySummary'
        - type: object
          additionalProperties: true
    ProviderCreateRequest:
      type: object
      required: [business_name]
      properties:
        business_name:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [draft, pending]
        contact_name:
          type: string
        email:
          type: string
        phone:
          type: string
        public_email:
          type: string
        public_phone:
          type: string
        website:
          type: string
        description:
          type: string
        service_model:
          type: string
          enum: [mobile, workshop, both]
        street_address:
          type: string
        base_town_id:
          type: integer
        region_id:
          type: integer
    ProviderPatchRequest:
      type: object
      properties:
        business_name:
          type: string
        contact_name:
          type: string
        email:
          type: string
        phone:
          type: string
        public_email:
          type: string
        public_phone:
          type: string
        website:
          type: string
        description:
          type: string
        service_model:
          type: string
          enum: [mobile, workshop, both]
        street_address:
          type: string
        base_town_id:
          type: integer
        region_id:
          type: integer
        display_name:
          type: string
        search_visible:
          type: boolean
        listing_status:
          type: string
          enum: [draft, pending, active, suspended, rejected]
    StayCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [draft, pending]
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        description:
          type: string
        town_id:
          type: integer
        state_id:
          type: integer
        region_id:
          type: integer
        stay_type:
          type: string
        price_type:
          type: string
        number_of_sites:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
    StayPatchRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        description:
          type: string
        town_id:
          type: integer
        state_id:
          type: integer
        region_id:
          type: integer
        stay_type:
          type: string
        price_type:
          type: string
        number_of_sites:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
    LifecycleDeleteRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
    DeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, deleted, reason]
          properties:
            id:
              type: string
            deleted:
              type: boolean
            reason:
              type: string
    RecycleBinCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecycleBinItem'
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    RecycleBinItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RecycleBinItem'
    RecycleBinItem:
      type: object
      required: [entity_type, id, name, deleted_at, lifecycle]
      properties:
        entity_type:
          type: string
          enum: [provider, stay]
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        deleted_at:
          type: string
        lifecycle:
          type: string
          enum: [deleted]
