openapi: 3.1.0
info:
  title: Assist Platform Admin API
  version: 1.0.0-increment-3
  description: |
    Versioned Admin API for Assist RIC and trusted management clients (CORE-011).
    Increment 3 adds service accounts, machine token exchange and scope enforcement.
    Increment 2 ships human login, refresh rotation, logout, me and sessions.
    Not a supported production partner API until MFA enforcement and Quality Gate evidence.
servers:
  - url: https://{host}/api/v1/admin
    variables:
      host:
        default: vanassist.com.au
tags:
  - name: System
  - name: Auth
  - name: ServiceAccounts
paths:
  /health:
    get:
      tags: [System]
      operationId: adminHealth
      summary: Liveness for the Admin API surface
      security: []
      responses:
        '200':
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Admin API disabled or platform unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /version:
    get:
      tags: [System]
      operationId: adminVersion
      summary: API and product version metadata
      security: []
      responses:
        '200':
          description: Version document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /capabilities:
    get:
      tags: [System]
      operationId: adminCapabilities
      summary: Declares implemented and planned Admin API capabilities
      security: []
      responses:
        '200':
          description: Capability document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /auth/login:
    post:
      tags: [Auth]
      operationId: adminAuthLogin
      summary: Exchange email and password for access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                session_label:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: Token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Role or restricted-mode denial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Login throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: adminAuthRefresh
      summary: Rotate refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/token:
    post:
      tags: [Auth]
      operationId: adminAuthServiceToken
      summary: Exchange service client credentials for a short-lived access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_key, client_secret]
              properties:
                client_key:
                  type: string
                client_secret:
                  type: string
                  format: password
      responses:
        '200':
          description: Service access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokenResponse'
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Service account inactive or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: adminAuthLogout
      summary: Revoke the current session (or all sessions)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                all_sessions:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      tags: [Auth]
      operationId: adminAuthMe
      summary: Current authenticated actor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Actor profile and scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /service-accounts:
    get:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsIndex
      summary: List service accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service account collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountsResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Human actor with service_accounts:admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsStore
      summary: Create a service account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountCreate'
      responses:
        '201':
          description: Created service account with secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountSecretResponse'
  /service-accounts/{id}:
    get:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsShow
      summary: Read service account metadata
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service account metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
    patch:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsUpdate
      summary: Update service account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountUpdate'
      responses:
        '200':
          description: Updated service account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
    delete:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsDestroy
      summary: Revoke service account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revoked service account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
  /service-accounts/{id}/rotate:
    post:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsRotate
      summary: Rotate service account secret
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rotated secret returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountSecretResponse'
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: adminAuthSessions
      summary: List active Admin API sessions for the current actor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: adminAuthRevokeSession
      summary: Revoke a session family by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found for this actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token from /auth/login, /auth/refresh or /auth/token. Only hashes are stored.
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, service, api_version]
          properties:
            status:
              type: string
              enum: [ok]
            service:
              type: string
            api_version:
              type: string
              enum: [v1]
    VersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [api_version, product]
          properties:
            api_version:
              type: string
            product:
              type: string
            release:
              type: string
              nullable: true
            php:
              type: string
    CapabilitiesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [api_version, enabled, resources]
          properties:
            api_version:
              type: string
            enabled:
              type: boolean
            restricted:
              type: boolean
            mfa_required:
              type: boolean
            mfa_enforced:
              type: boolean
            authentication:
              type: object
              additionalProperties:
                type: string
            resources:
              type: object
              additionalProperties:
                type: string
            limits:
              type: object
              additionalProperties: true
            scopes:
              type: object
              additionalProperties:
                type: object
                properties:
                  human:
                    type: boolean
                  service:
                    type: boolean
                  description:
                    type: string
            notes:
              type: array
              items:
                type: string
    TokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, refresh_token, token_type, expires_in, scopes, user]
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
            scopes:
              type: array
              items:
                type: string
            user:
              $ref: '#/components/schemas/AdminUser'
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [scopes, actor_type]
          properties:
            user:
              $ref: '#/components/schemas/AdminUser'
              nullable: true
            client:
              $ref: '#/components/schemas/ServiceAccount'
              nullable: true
            scopes:
              type: array
              items:
                type: string
            actor_type:
              type: string
              enum: [user, service]
    ServiceTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, token_type, expires_in, scopes, actor_type, client]
          properties:
            access_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
            scopes:
              type: array
              items:
                type: string
            actor_type:
              type: string
              enum: [service]
            client:
              $ref: '#/components/schemas/ServiceAccount'
    ServiceAccount:
      type: object
      required: [id, name, client_key, status, scopes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        client_key:
          type: string
        status:
          type: string
          enum: [active, disabled, revoked]
        scopes:
          type: array
          items:
            type: string
        token_ttl_seconds:
          type: integer
        expires_at:
          type: string
          nullable: true
        last_used_at:
          type: string
          nullable: true
        created_by:
          type: integer
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
          nullable: true
    ServiceAccountCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        token_ttl_seconds:
          type: integer
        expires_at:
          type: string
          nullable: true
    ServiceAccountUpdate:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        token_ttl_seconds:
          type: integer
        expires_at:
          type: string
          nullable: true
    ServiceAccountResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ServiceAccount'
    ServiceAccountSecretResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/ServiceAccount'
            - type: object
              required: [client_secret]
              properties:
                client_secret:
                  type: string
    ServiceAccountsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
    LogoutResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [logged_out]
          properties:
            logged_out:
              type: boolean
    SessionsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, active]
            properties:
              id:
                type: string
              label:
                type: string
                nullable: true
              ip_address:
                type: string
                nullable: true
              user_agent:
                type: string
                nullable: true
              created_at:
                type: string
              expires_at:
                type: string
              active:
                type: boolean
    RevokeSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [revoked, id]
          properties:
            revoked:
              type: boolean
            id:
              type: string
    AdminUser:
      type: object
      required: [id, name, email, roles, mfa_enabled]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        mfa_enabled:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          type: object
          additionalProperties: true
