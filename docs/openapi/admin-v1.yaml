openapi: 3.1.0
info:
  title: Assist Platform Admin API
  version: 1.0.0-increment-9
  description: |
    Versioned Admin API for Assist RIC and trusted management clients (CORE-011).
    Increment 9 completes Phase 1 foundation with RIC contract tests.
    Increment 8 adds audit read, search-gap analytics and MFA verify scaffold.
    Increment 7 adds draft/import submission, validation and staging for RIC.
    Increment 6 adds recycle bin list, restore and permanent purge.
    Increment 5 adds audited provider/stay writes and lifecycle transitions.
    Increment 4 adds read-only providers and stays with cursor pagination.
    Increment 3 adds service accounts, machine token exchange and scope enforcement.
    Increment 2 ships human login, refresh rotation, logout, me and sessions.
    Not a supported production partner API until MFA enforcement and Quality Gate evidence.
servers:
  - url: https://{host}/api/v1/admin
    variables:
      host:
        default: vanassist.com.au
tags:
  - name: System
  - name: Auth
  - name: ServiceAccounts
  - name: Providers
  - name: Stays
  - name: RecycleBin
  - name: Drafts
  - name: Imports
  - name: Audit
  - name: Analytics
  - name: AI
  - name: FeatureFlags
  - name: Sync
paths:
  /health:
    get:
      tags: [System]
      operationId: adminHealth
      summary: Liveness for the Admin API surface
      security: []
      responses:
        '200':
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Admin API disabled or platform unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /version:
    get:
      tags: [System]
      operationId: adminVersion
      summary: API and product version metadata
      security: []
      responses:
        '200':
          description: Version document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /capabilities:
    get:
      tags: [System]
      operationId: adminCapabilities
      summary: Declares implemented and planned Admin API capabilities
      security: []
      responses:
        '200':
          description: Capability document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /overview:
    get:
      tags: [Analytics]
      operationId: adminOverview
      summary: Operational overview rollup for Assist RIC
      description: |
        Returns website KPIs (bot/unknown page views excluded from visitor totals),
        review-queue counts, AI usage summary (when ai:read), dataset sync timestamps,
        attention items and warnings. Requires analytics:read. Optional sections are
        omitted or marked available=false when the token lacks related scopes.
      security:
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, fy, pfy, custom]
            default: 30d
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Overview document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [system, website, queues, attention, warnings, labels]
                    properties:
                      generated_at:
                        type: string
                        format: date-time
                      range:
                        type: object
                      brand:
                        type: object
                      system:
                        type: object
                      website:
                        type: object
                      queues:
                        type: object
                      ai:
                        type: object
                      datasets:
                        type: object
                      attention:
                        type: array
                        items:
                          type: object
                      warnings:
                        type: array
                        items:
                          type: object
                      labels:
                        type: object
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing analytics:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /website-insights:
    get:
      tags: [Analytics]
      operationId: adminWebsiteInsights
      summary: Brand website insights with bot traffic labelled separately
      description: |
        Reuses WebsiteInsightsService. Genuine visitors exclude bot/unknown device
        page views. filtered_bot_page_views is labelled separately and never mixed
        into visitor totals. Requires analytics:read.
      security:
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, fy, pfy, custom]
            default: 30d
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Website insights document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [summary, filtered_bot_page_views, labels]
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing analytics:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: adminAuthLogin
      summary: Exchange email and password for access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                session_label:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: Token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Role or restricted-mode denial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Login throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: adminAuthRefresh
      summary: Rotate refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/token:
    post:
      tags: [Auth]
      operationId: adminAuthServiceToken
      summary: Exchange service client credentials for a short-lived access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_key, client_secret]
              properties:
                client_key:
                  type: string
                client_secret:
                  type: string
                  format: password
      responses:
        '200':
          description: Service access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokenResponse'
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Service account inactive or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: adminAuthLogout
      summary: Revoke the current session (or all sessions)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                all_sessions:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      tags: [Auth]
      operationId: adminAuthMe
      summary: Current authenticated actor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Actor profile and scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /service-accounts:
    get:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsIndex
      summary: List service accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service account collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountsResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Human actor with service_accounts:admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsStore
      summary: Create a service account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountCreate'
      responses:
        '201':
          description: Created service account with secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountSecretResponse'
  /service-accounts/{id}:
    get:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsShow
      summary: Read service account metadata
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service account metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
    patch:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsUpdate
      summary: Update service account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountUpdate'
      responses:
        '200':
          description: Updated service account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
    delete:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsDestroy
      summary: Revoke service account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revoked service account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
  /service-accounts/{id}/rotate:
    post:
      tags: [ServiceAccounts]
      operationId: adminServiceAccountsRotate
      summary: Rotate service account secret
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rotated secret returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountSecretResponse'
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: adminAuthSessions
      summary: List active Admin API sessions for the current actor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: adminAuthRevokeSession
      summary: Revoke a session family by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found for this actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /providers:
    get:
      tags: [Providers]
      operationId: adminProvidersIndex
      summary: List providers in the current brand scope
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/QueryQ'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Town'
        - $ref: '#/components/parameters/State'
      responses:
        '200':
          description: Provider collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCollection'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing providers:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Providers]
      operationId: adminProvidersStore
      summary: Create a provider in the current brand scope
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreateRequest'
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing providers:write scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /providers/{id}:
    get:
      tags: [Providers]
      operationId: adminProvidersShow
      summary: Provider detail in the current brand scope
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
        '404':
          description: Not found in brand scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Providers]
      operationId: adminProvidersUpdate
      summary: Update provider and brand listing fields
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPatchRequest'
      responses:
        '200':
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing providers:write scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found in brand scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Providers]
      operationId: adminProvidersDestroy
      summary: Soft-delete a provider (reason required)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleDeleteRequest'
      responses:
        '200':
          description: Provider soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing lifecycle:write scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /providers/{id}/publish:
    post:
      tags: [Providers]
      operationId: adminProvidersPublish
      summary: Publish provider listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Provider published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
        '403':
          description: Missing lifecycle:write scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /providers/{id}/unpublish:
    post:
      tags: [Providers]
      operationId: adminProvidersUnpublish
      summary: Unpublish provider listing (search_visible=0)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Provider unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
  /providers/{id}/archive:
    post:
      tags: [Providers]
      operationId: adminProvidersArchive
      summary: Archive provider (status=suspended)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Provider archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
  /providers/{id}/restore:
    post:
      tags: [Providers]
      operationId: adminProvidersRestore
      summary: Restore soft-deleted provider
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Provider restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
  /stays:
    get:
      tags: [Stays]
      operationId: adminStaysIndex
      summary: List stays (caravan_parks); ADR 0019
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/QueryQ'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Town'
        - $ref: '#/components/parameters/State'
      responses:
        '200':
          description: Stay collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayCollection'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Stays]
      operationId: adminStaysStore
      summary: Create a stay
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StayCreateRequest'
      responses:
        '201':
          description: Stay created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayDetailResponse'
        '403':
          description: Missing stays:write scope or stays unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /stays/{id}:
    get:
      tags: [Stays]
      operationId: adminStaysShow
      summary: Stay detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stay detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayDetailResponse'
        '404':
          description: Not found or stays unavailable for brand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Stays]
      operationId: adminStaysUpdate
      summary: Update stay fields
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StayPatchRequest'
      responses:
        '200':
          description: Stay updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayDetailResponse'
    delete:
      tags: [Stays]
      operationId: adminStaysDestroy
      summary: Soft-delete a stay (reason required)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleDeleteRequest'
      responses:
        '200':
          description: Stay soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
  /stays/{id}/publish:
    post:
      tags: [Stays]
      operationId: adminStaysPublish
      summary: Publish stay
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stay published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayDetailResponse'
  /stays/{id}/unpublish:
    post:
      tags: [Stays]
      operationId: adminStaysUnpublish
      summary: Unpublish stay (public_page_enabled=0)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stay unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayDetailResponse'
  /stays/{id}/archive:
    post:
      tags: [Stays]
      operationId: adminStaysArchive
      summary: Archive stay (status=suspended)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stay archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayDetailResponse'
