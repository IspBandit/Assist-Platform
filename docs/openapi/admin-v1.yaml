              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '401':
          description: Missing or non-human bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/mfa/enroll/begin:
    post:
      tags: [Auth]
      operationId: adminAuthMfaEnrollBegin
      summary: Begin TOTP enrollment for the authenticated human
      description: |
        Requires a full human session (not an MFA challenge token). Returns a
        base32 secret and otpauth URI once; confirm with /auth/mfa/enroll/confirm.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
      responses:
        '200':
          description: Enrollment secret issued
        '401':
          description: Missing or non-human bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: MFA already enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/mfa/enroll/confirm:
    post:
      tags: [Auth]
      operationId: adminAuthMfaEnrollConfirm
      summary: Confirm TOTP enrollment with an authenticator code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: MFA enrolled
        '422':
          description: Invalid code or enrollment not started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
