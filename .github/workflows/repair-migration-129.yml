name: Repair interrupted migration 129

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type REPAIR_129 to clear only an interrupted migration 129 history row
        required: true

permissions:
  contents: read

jobs:
  repair:
    if: github.event.inputs.confirm == 'REPAIR_129' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH host
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Repair only interrupted migration 129
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp scripts/repair-interrupted-migration-129.php "$VPS_USER@$VPS_HOST:/tmp/repair-interrupted-migration-129.php"
          ssh "$VPS_USER@$VPS_HOST" "sudo docker cp /tmp/repair-interrupted-migration-129.php assist-platform-app-1:/tmp/repair-interrupted-migration-129.php && cd /opt/assist-platform && sudo docker compose exec -T -e ASSIST_APP_ROOT=/var/www/html app php /tmp/repair-interrupted-migration-129.php && rm -f /tmp/repair-interrupted-migration-129.php"
