name: assist-platform

services:
  app:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./config/app.env
    volumes:
      - ./current:/var/www/html:ro
      - ./shared/storage:/var/www/html/storage
      - ./shared/uploads-public:/var/www/html/public/uploads-public
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/healthz SCRIPT_FILENAME=/var/www/html/public/index.php REQUEST_METHOD=GET REQUEST_URI=/healthz cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: ./config/infra.env
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./current:/var/www/html:ro
      - ./shared/uploads-public:/var/www/html/public/uploads-public:ro
      - /opt/cqdiggings/current:/var/www/cqdiggings:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-blair-athol.html:/var/www/cqdiggings/clermont-blair-athol.html:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-gold-investigation.css:/var/www/cqdiggings/clermont-gold-investigation.css:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-gold-investigation.html:/var/www/cqdiggings/clermont-gold-investigation.html:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-gold-investigation.js:/var/www/cqdiggings/clermont-gold-investigation.js:ro
      - ./current/infrastructure/cqdiggings-overlay/data/clermont-field-validation-points.geojson:/var/www/cqdiggings/data/clermont-field-validation-points.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/clermont-legal-gold-prospectivity.geojson:/var/www/cqdiggings/data/clermont-legal-gold-prospectivity.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/clermont-prospectivity-watercourses.geojson:/var/www/cqdiggings/data/clermont-prospectivity-watercourses.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/gladstone-gold-occurrences.json:/var/www/cqdiggings/data/gladstone-gold-occurrences.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/gold-path-model.json:/var/www/cqdiggings/data/gold-path-model.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/historical-research/gold/historical-alluvial-evidence.geojson:/var/www/cqdiggings/data/historical-research/gold/historical-alluvial-evidence.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/historical-research/gold/historical-gold-sources.geojson:/var/www/cqdiggings/data/historical-research/gold/historical-gold-sources.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/historical-research/research-data-catalog.json:/var/www/cqdiggings/data/historical-research/research-data-catalog.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/occurrence-report-matches.json:/var/www/cqdiggings/data/occurrence-report-matches.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/production-assay-register.json:/var/www/cqdiggings/data/production-assay-register.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/queensland-gold-occurrences.json:/var/www/cqdiggings/data/queensland-gold-occurrences.json:ro
      - ./current/infrastructure/cqdiggings-overlay/index.html:/var/www/cqdiggings/index.html:ro
      - ./current/infrastructure/cqdiggings-overlay/map-20260814.js:/var/www/cqdiggings/map-20260814.js:ro
      - ./current/infrastructure/cqdiggings-overlay/map.html:/var/www/cqdiggings/map.html:ro
      - ./current/infrastructure/cqdiggings-overlay/old-diggings-map-regional.js:/var/www/cqdiggings/old-diggings-map-regional.js:ro
      - ./current/infrastructure/cqdiggings-overlay/old-diggings-map.html:/var/www/cqdiggings/old-diggings-map.html:ro
      - ./current/infrastructure/cqdiggings-overlay/service-worker.js:/var/www/cqdiggings/service-worker.js:ro
      - ./current/infrastructure/cqdiggings-overlay/site-index.html:/var/www/cqdiggings/site-index.html:ro
      - ./current/infrastructure/cqdiggings-overlay/sitemap.xml:/var/www/cqdiggings/sitemap.xml:ro
      - ./current/infrastructure/cqdiggings-overlay/research/queensland-high-grade-gold-investigation.md:/var/www/cqdiggings/research/queensland-high-grade-gold-investigation.md:ro
      - /opt/cqdiggings/shared/data:/srv/cqdiggings-public/data:ro
      - /opt/cqdiggings/shared/assets:/srv/cqdiggings-public/assets:ro
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  cqdiggings:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /opt/cqdiggings/current:/var/www/cqdiggings:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-blair-athol.html:/var/www/cqdiggings/clermont-blair-athol.html:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-gold-investigation.css:/var/www/cqdiggings/clermont-gold-investigation.css:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-gold-investigation.html:/var/www/cqdiggings/clermont-gold-investigation.html:ro
      - ./current/infrastructure/cqdiggings-overlay/clermont-gold-investigation.js:/var/www/cqdiggings/clermont-gold-investigation.js:ro
      - ./current/infrastructure/cqdiggings-overlay/data/clermont-field-validation-points.geojson:/var/www/cqdiggings/data/clermont-field-validation-points.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/clermont-legal-gold-prospectivity.geojson:/var/www/cqdiggings/data/clermont-legal-gold-prospectivity.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/clermont-prospectivity-watercourses.geojson:/var/www/cqdiggings/data/clermont-prospectivity-watercourses.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/gladstone-gold-occurrences.json:/var/www/cqdiggings/data/gladstone-gold-occurrences.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/gold-path-model.json:/var/www/cqdiggings/data/gold-path-model.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/historical-research/gold/historical-alluvial-evidence.geojson:/var/www/cqdiggings/data/historical-research/gold/historical-alluvial-evidence.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/historical-research/gold/historical-gold-sources.geojson:/var/www/cqdiggings/data/historical-research/gold/historical-gold-sources.geojson:ro
      - ./current/infrastructure/cqdiggings-overlay/data/historical-research/research-data-catalog.json:/var/www/cqdiggings/data/historical-research/research-data-catalog.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/occurrence-report-matches.json:/var/www/cqdiggings/data/occurrence-report-matches.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/production-assay-register.json:/var/www/cqdiggings/data/production-assay-register.json:ro
      - ./current/infrastructure/cqdiggings-overlay/data/queensland-gold-occurrences.json:/var/www/cqdiggings/data/queensland-gold-occurrences.json:ro
      - ./current/infrastructure/cqdiggings-overlay/index.html:/var/www/cqdiggings/index.html:ro
      - ./current/infrastructure/cqdiggings-overlay/map-20260814.js:/var/www/cqdiggings/map-20260814.js:ro
      - ./current/infrastructure/cqdiggings-overlay/map.html:/var/www/cqdiggings/map.html:ro
      - ./current/infrastructure/cqdiggings-overlay/old-diggings-map-regional.js:/var/www/cqdiggings/old-diggings-map-regional.js:ro
      - ./current/infrastructure/cqdiggings-overlay/old-diggings-map.html:/var/www/cqdiggings/old-diggings-map.html:ro
      - ./current/infrastructure/cqdiggings-overlay/service-worker.js:/var/www/cqdiggings/service-worker.js:ro
      - ./current/infrastructure/cqdiggings-overlay/site-index.html:/var/www/cqdiggings/site-index.html:ro
      - ./current/infrastructure/cqdiggings-overlay/sitemap.xml:/var/www/cqdiggings/sitemap.xml:ro
      - ./current/infrastructure/cqdiggings-overlay/research/queensland-high-grade-gold-investigation.md:/var/www/cqdiggings/research/queensland-high-grade-gold-investigation.md:ro
      - /opt/cqdiggings/shared/analytics/config.php:/var/www/cqdiggings/analytics/config.php:ro
      - /opt/cqdiggings/shared/analytics/dashboard-config.php:/var/www/cqdiggings/analytics/dashboard-config.php:ro
